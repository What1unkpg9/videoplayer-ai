# .github/workflows/build.yml
name: Build Portable Executable (Manual)

on:
  workflow_dispatch:
    inputs:
      upload_suffix:
        description: 'Optional suffix for artifact name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: vlc-player-linux
            # Ubuntu: vlc (либы и плагины), libvlc-dev (хэдеры для python-vlc при импорте в build.py), python3-dev
            install_cmd: sudo apt-get update && sudo apt-get install -y vlc libvlc-dev python3-dev
            ext: ""
          - os: windows-latest
            artifact_name: vlc-player-windows
            # Windows: VLC через Chocolatey. Версия 3.0.21 стабильна.
            install_cmd: choco install vlc --version=3.0.21 -y
            ext: ".exe"
          - os: macos-latest
            artifact_name: vlc-player-macos
            # macOS: VLC через Homebrew. Ставит формулу (keg-only) в /usr/local/opt/vlc или /opt/homebrew/opt/vlc
            install_cmd: brew install vlc
            ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (VLC + Build Tools)
        run: ${{ matrix.install_cmd }}
        shell: bash

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller python-vlc
        shell: bash

      - name: Build Portable Executable
        run: python build.py
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}${{ github.event.inputs.upload_suffix }}
          path: dist_portable/${{ matrix.artifact_name }}${{ matrix.ext }}
          retention-days: 30
          if-no-files-found: error
