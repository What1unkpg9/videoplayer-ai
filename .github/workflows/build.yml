# .github/workflows/build.yml
name: Build Portable Executable (Manual)

on:
  workflow_dispatch:
    inputs:
      upload_name_suffix:
        description: 'Suffix for artifact name (e.g. v1.0-beta)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: ставим vlc и dev пакеты (чтобы были headers/libs для python-vlc при импорте в build.py)
          - os: ubuntu-latest
            artifact_name: vlc-player-linux
            install_cmd: sudo apt-get update && sudo apt-get install -y vlc libvlc-dev python3-dev
            ext: ""
          # Windows: ставим VLC через chocolatey
          - os: windows-latest
            artifact_name: vlc-player-windows
            install_cmd: choco install vlc --version=3.0.21 -y
            ext: ".exe"
          # macOS: ставим VLC через brew
          - os: macos-latest
            artifact_name: vlc-player-macos
            install_cmd: brew install vlc
            ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (VLC + Build Tools)
        run: ${{ matrix.install_cmd }}
        shell: bash

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller python-vlc
        shell: bash

      - name: Build Portable Executable
        run: python build.py
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}${{ github.event.inputs.upload_name_suffix }}
          path: dist_portable/${{ matrix.artifact_name }}${{ matrix.ext }}
          retention-days: 30
          if-no-files-found: error
