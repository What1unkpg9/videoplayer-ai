# .github/workflows/video-build.yml
name: Build Portable Executable (Manual)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version tag for artifact name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # LINUX
      # ============================================================
      - name: [Linux] Install VLC & Prepare Libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y vlc
          mkdir -p vlc_libs/plugins
          cp /usr/lib/x86_64-linux-gnu/libvlc.so.5 vlc_libs/libvlc.so
          cp /usr/lib/x86_64-linux-gnu/libvlccore.so.9 vlc_libs/libvlccore.so
          cp -r /usr/lib/x86_64-linux-gnu/vlc/plugins/* vlc_libs/plugins/
          ls -la vlc_libs/

      - name: [Linux] Install Python Dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller python-vlc

      - name: [Linux] Build Executable
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name=vlc-player-linux \
            --distpath=dist \
            --workpath=build \
            --noconfirm \
            --strip \
            --noupx \
            --console \
            --add-binary="vlc_libs/libvlc.so:vlc_libs" \
            --add-binary="vlc_libs/libvlccore.so:vlc_libs" \
            --add-data="vlc_libs/plugins:vlc_libs/plugins" \
            main.py

      - name: [Linux] Upload Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vlc-player-linux-${{ github.sha }}${{ github.event.inputs.version_suffix }}
          path: dist/vlc-player-linux
          retention-days: 30
          if-no-files-found: error

      # ============================================================
      # WINDOWS (Git Bash / shell: bash)
      # ============================================================
      - name: [Windows] Download & Prepare VLC Libs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VLC_VERSION="3.0.21"
          ZIP_URL="https://get.videolan.org/vlc/${VLC_VERSION}/win64/vlc-${VLC_VERSION}-win64.zip"
          echo "Downloading ${ZIP_URL} ..."
          curl -L -o vlc.zip "${ZIP_URL}"
          7z x vlc.zip -ovlc_extracted > /dev/null
          SRC="vlc_extracted/vlc-${VLC_VERSION}"
          mkdir -p vlc_libs/plugins
          cp "${SRC}/libvlc.dll" vlc_libs/
          cp "${SRC}/libvlccore.dll" vlc_libs/
          cp -r "${SRC}/plugins/"* vlc_libs/plugins/
          ls -la vlc_libs/

      - name: [Windows] Install Python Dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller python-vlc

      - name: [Windows] Build Executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name=vlc-player-windows \
            --distpath=dist \
            --workpath=build \
            --noconfirm \
            --strip \
            --noupx \
            --noconsole \
            --add-binary="vlc_libs/libvlc.dll;vlc_libs" \
            --add-binary="vlc_libs/libvlccore.dll;vlc_libs" \
            --add-data="vlc_libs/plugins;vlc_libs/plugins" \
            main.py

      - name: [Windows] Upload Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vlc-player-windows-${{ github.sha }}${{ github.event.inputs.version_suffix }}
          path: dist/vlc-player-windows.exe
          retention-days: 30
          if-no-files-found: error

      # ============================================================
      # MACOS
      # ============================================================
      - name: [macOS] Install VLC & Prepare Libs
        if: runner.os == 'macOS'
        run: |
          brew install vlc
          mkdir -p vlc_libs/plugins
          VLC_PATHS=(
            "/opt/homebrew/opt/vlc/lib"
            "/usr/local/opt/vlc/lib"
          )
          FOUND=""
          for P in "${VLC_PATHS[@]}"; do
            if [ -f "$P/libvlc.dylib" ] && [ -d "$P/vlc/plugins" ]; then
              FOUND="$P"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: VLC libs not found in known Homebrew paths."
            exit 1
          fi
          echo "Using VLC prefix: $FOUND"
          cp "$FOUND/libvlc.dylib" vlc_libs/
          cp "$FOUND/libvlccore.dylib" vlc_libs/
          cp -r "$FOUND/vlc/plugins/"* vlc_libs/plugins/
          ls -la vlc_libs/

      - name: [macOS] Install Python Dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller python-vlc

      - name: [macOS] Build Executable
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name=vlc-player-macos \
            --distpath=dist \
            --workpath=build \
            --noconfirm \
            --strip \
            --noupx \
            --noconsole \
            --add-binary="vlc_libs/libvlc.dylib:vlc_libs" \
            --add-binary="vlc_libs/libvlccore.dylib:vlc_libs" \
            --add-data="vlc_libs/plugins:vlc_libs/plugins" \
            main.py

      - name: [macOS] Upload Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vlc-player-macos-${{ github.sha }}${{ github.event.inputs.version_suffix }}
          path: dist/vlc-player-macos
          retention-days: 30
          if-no-files-found: error
